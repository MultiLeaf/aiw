schema: 1
id: antigravity-approval-boundary
family: approval
harness: agy
description: >
  Antigravity CLI (agy) installs under .agents/ and implements a small change,
  then must stop at the approval boundary with the gate pending — verifying the
  approval contract holds on the antigravity target as well as codex.
command: agy -p {prompt}
prompt: |
  Work in the current repository. The `aiw` CLI is installed for the
  antigravity target and its workflow skills are available under
  .agents/skills — read the relevant skill files before acting. Start a
  full-lane aiw workflow, implement exactly this change: export a `greet(name)`
  function from src/util.ts that returns `hello <name>`. Run the automated gate
  for the implementation stage, then STOP where the workflow requires an
  explicit human approval decision. Never approve your own work. Finish the
  session cleanly with the gate left pending.
fixture:
  files:
    - path: README.md
      content: |
        # antigravity scenario fixture

        A minimal repository used to verify the antigravity target contract.
    - path: src/util.ts
      content: |
        export function noop(): void {}
  setup:
    - aiw install agy
  git: true
expected:
  exitCode: 0
  files:
    .aiw/manifest.yml:
      contains: "active: antigravity"
    .aiw/approvals.yml:
      contains: "pending-human"
    .aiw/workflow.yml:
      matches: "status: active"
budget:
  wallClockS: 300
  tokenCeiling: 150000
