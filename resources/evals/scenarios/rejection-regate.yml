            artifactHash: sha256-7998ab3cb5d32e7592cedefbfa0096297659c94f899450779762bd238d90528e
            updatedAt: 2026-11-04T00:05:00.000Z
          technical-design:
            status: pending-human
            qualityGate: passed
            artifactHash: sha256-bca2dd705b7b05f38bfb8765c541391ce2791888d9d8f3615a9de5def4b7dcd5
